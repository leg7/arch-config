#-------------------------------------------------------------------------------------------------#
#                                           ENVIRONMENT                                           #
#-------------------------------------------------------------------------------------------------#

# XDG & Toolkit Backend Variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,Adwaita

# Cursor
env = XCURSOR_THEME,Banana
env = XCURSOR_SIZE,32

#-------------------------------------------------------------------------------------------------#
#                                           ANIMATIONS                                            #
#-------------------------------------------------------------------------------------------------#

bezier = overshoot, 0.05, 0.9, 0.1, 1.1

animation = workspaces, 1, 1, default, slidefade
animation = windows, 1, 1, default, popin
animation = layers, 1, 1, default, slide
animation = border, 1, 3, default

#-------------------------------------------------------------------------------------------------#
#                                            AUTOSTART                                            #
#-------------------------------------------------------------------------------------------------#

# System basics
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = easyeffects --gapplication-service
exec-once = setbg -i
exec-once = fnott
exec-once = wlsunset -S 6:00 -s 21:00 -t 4000 -d 900
exec-once = transmission-daemon
exec-once = syncthing --no-browser

# Terminals & Daemons
exec-once = foot --server
exec-once = mpd
exec-once = mpd-brainz

exec-once = kanshi

#-------------------------------------------------------------------------------------------------#
#                                              INPUT                                              #
#-------------------------------------------------------------------------------------------------#

input {
    # Keyboard
    repeat_rate = 50
    repeat_delay = 300

    # Global Mouse / Touchpad Defaults
    follow_mouse = 1
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        middle_button_emulation = true
        clickfinger_behavior = true
    }
}

# Per-device Configs
# NOTE: Run 'hyprctl devices' to get the exact names if these don't work immediately.

device {
    name = logitech-usb-receiver
    accel_profile = flat
}
device {
    name = logitech-g305-1
    accel_profile = flat
}

device {
    name = synaptics-tm3276-022
    accel_profile = adaptive
    sensitivity = 0.3
}
device {
    name = elan0773:00-04f3:3244-touchpad
    accel_profile = adaptive
    sensitivity = 0.3
}

device {
    name = tpps/2-ibm-trackpoint
    accel_profile = adaptive
    sensitivity = 0.0 # 0.0 adds nothing to base speed (effectively 1.0 multiplier)
}

cursor {
    no_warps = false         # set-cursor-warp on-focus-change
    inactive_timeout = 5     # hide-cursor timeout 5000 (seconds)
    hide_on_key_press = true # hide-cursor when-typing enabled
}


#-------------------------------------------------------------------------------------------------#
#                                        LAYOUT & COLORS                                          #
#-------------------------------------------------------------------------------------------------#

general {
    layout = dwindle

    gaps_in = 6
    gaps_out = 12
    border_size = 5

    col.active_border = rgb(ff5f1f)
    col.inactive_border = rgb(101623)
}

decoration {
    # Disabling Hyprland's default blur/rounding to match your River aesthetic
    rounding = 0
    blur {
        enabled = true
    }
    shadow {
        enabled = true
		range = 8
		render_power = 4
    }
}

misc {
    background_color = rgb(586e75)
    disable_hyprland_logo = true
}

# Layout Behavior (Rivercarro emulation)
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2 # Always split to the right (similar to main-location right)
}

#-------------------------------------------------------------------------------------------------#
#                                          WINDOW RULES                                           #
#-------------------------------------------------------------------------------------------------#

# Tags in River = Workspaces in Hyprland.
# River: 1<<5 is the 6th tag -> Workspace 6

# windowrulev2 = workspace 6, class:(.*steam.*)
# windowrulev2 = float, class:(steam_app_.*)
# windowrulev2 = fullscreen, class:(steam_app_.*)
#
# windowrulev2 = workspace 6, class:(Logseq)
# windowrulev2 = fullscreen, class:(Logseq)
#
# windowrulev2 = float, title:(pulsemixer)
# windowrulev2 = float, title:(emoji-picker)
# windowrulev2 = fullscreen, title:(satty)
#
# # Qalculate
# windowrulev2 = float, class:(qalculate-gtk)
# windowrulev2 = size 500 200, class:(qalculate-gtk)
# windowrulev2 = move 40 70, class:(qalculate-gtk)
# # In Hyprland, "pinned" makes it stick to all workspaces (like your all_tags rule)
# windowrulev2 = pin, class:(qalculate-gtk)

#-------------------------------------------------------------------------------------------------#
#                                           KEYBINDINGS                                           #
#-------------------------------------------------------------------------------------------------#

$mainMod = SUPER

# --- Application Launchers ---
bind = $mainMod CONTROL, B, exec, $BROWSER
bind = $mainMod CONTROL, C, exec, qalculate-gtk
bind = $mainMod CONTROL, E, exec, foot -f monospace:pixelsize=20 -T emoji-picker emoji
bind = $mainMod CONTROL, F, exec, nemo
bind = $mainMod CONTROL, G, exec, steam
bind = $mainMod CONTROL, L, exec, swaylock
bind = $mainMod CONTROL, M, exec, music
bind = $mainMod CONTROL, N, exec, neovide
bind = $mainMod CONTROL, Q, exec, qr
bind = $mainMod CONTROL, R, exec, fuzzel
bind = $mainMod CONTROL, T, exec, footclient
bind = $mainMod CONTROL, V, exec, footclient -T pulsemixer pulsemixer
bind = $mainMod CONTROL, W, exec, wl-color-picker
bind = $mainMod CONTROL, X, killactive

# --- Focus & Movement (Normal Mode) ---
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r

bind = $mainMod, F, fullscreen
bind = $mainMod, Z, fullscreen, 1 # 1 = maximize (zoom)

bind = $mainMod, Period, focusmonitor, +1
bind = $mainMod, Comma, focusmonitor, -1

# --- Layout Manipulation ---
# Emulating rivercarro ratio changes
bind = $mainMod ALT, H, splitratio, -0.05
bind = $mainMod ALT, L, splitratio, +0.05

# --- Submaps (River Modes) ---

# -- Move Mode --
bind = $mainMod ALT, M, submap, move
submap = move

    bind = , J, swapwindow, d
    bind = , K, swapwindow, u
    bind = , H, swapwindow, l
    bind = , L, swapwindow, r

    bind = , Period, movewindow, mon:+1
    bind = , Period, focusmonitor, +1
    bind = , Comma, movewindow, mon:-1
    bind = , Comma, focusmonitor, -1

    bind = ALT, Period, movewindow, mon:+1
    bind = ALT, Comma, movewindow, mon:-1

    bind = , Escape, submap, reset
submap = reset

# -- Float Mode --
bind = $mainMod ALT, F, submap, floatmode
submap = floatmode

    bind = , T, togglefloating

    # Move (step 50)
    binde = , H, moveactive, -50 0
    binde = , J, moveactive, 0 50
    binde = , K, moveactive, 0 -50
    binde = , L, moveactive, 50 0

    # Resize (step 50)
    binde = CONTROL, H, resizeactive, -50 0
    binde = CONTROL, J, resizeactive, 0 50
    binde = CONTROL, K, resizeactive, 0 -50
    binde = CONTROL, L, resizeactive, 50 0

    # Snapping not native in Hyprland config, mapped to simple moves for now
    bind = ALT, H, movewindow, l
    bind = ALT, J, movewindow, d
    bind = ALT, K, movewindow, u
    bind = ALT, L, movewindow, r

    bind = , Escape, submap, reset
submap = reset

# -- Passthrough Mode --
bind = $mainMod ALT, F11, submap, passthrough
submap = passthrough
    bind = $mainMod ALT, F11, submap, reset
submap = reset

# --- Mouse Bindings ---
bindm = $mainMod, mouse:272, movewindow    # Left Click
bindm = $mainMod, mouse:273, resizewindow  # Right Click
bind = $mainMod, mouse:274, togglefloating # Middle Click

# --- Workspaces (Tags) ---
# Mapping letters to Workspaces 1-8
# C=1, T=2, D=3, I=4, M=5, G=6, N=7, O=8

bind = $mainMod, C, workspace, 1
bind = $mainMod SHIFT, C, movetoworkspace, 1
bind = $mainMod ALT, C, movetoworkspace, 1

bind = $mainMod, T, workspace, 2
bind = $mainMod SHIFT, T, movetoworkspace, 2
bind = $mainMod ALT, T, movetoworkspace, 2

bind = $mainMod, D, workspace, 3
bind = $mainMod SHIFT, D, movetoworkspace, 3
bind = $mainMod ALT, D, movetoworkspace, 3

bind = $mainMod, I, workspace, 4
bind = $mainMod SHIFT, I, movetoworkspace, 4
bind = $mainMod ALT, I, movetoworkspace, 4

bind = $mainMod, M, workspace, 5
bind = $mainMod SHIFT, M, movetoworkspace, 5
bind = $mainMod ALT, M, movetoworkspace, 5

bind = $mainMod, G, workspace, 6
bind = $mainMod SHIFT, G, movetoworkspace, 6
bind = $mainMod ALT, G, movetoworkspace, 6

bind = $mainMod, N, workspace, 7
bind = $mainMod SHIFT, N, movetoworkspace, 7
bind = $mainMod ALT, N, movetoworkspace, 7

bind = $mainMod, O, workspace, 8
bind = $mainMod SHIFT, O, movetoworkspace, 8
bind = $mainMod ALT, O, movetoworkspace, 8

# "All Tags" -> Special Workspace (Scratchpad)
bind = $mainMod, A, togglespecialworkspace
bind = $mainMod SHIFT, A, movetoworkspace, special

# --- Media & Hardware Keys ---
bindl = , XF86AudioRaiseVolume, exec, pamixer -i 2
bindl = , XF86AudioLowerVolume, exec, pamixer -d 2
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioMedia, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bind = , Print, exec, flameshot gui
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +2%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 2%-

#-------------------------------------------------------------------------------------------------#
#                                           MONITORS                                              #
#-------------------------------------------------------------------------------------------------#

monitorv2 {
	output = desc:Shenzhen KTC Technology Group M27T6
	mode = 2560x1440@180
	position = 0x0
	scale = 1
	bitdepth = 10
	supports_hdr = 1
	supports_wide_color = 1
}

monitorv2 {
	output = DP-6
	mode = 2560x1440@170
	position = 1920x0
	scale = 1
	bitdepth = 8
	supports_hdr = 1
}

monitorv2 {
	output = eDP-1
	mode = 1920x1080@60
	scale = 1
}

monitor = , preferred, auto, 1

# Optional: Enhanced HDR/Color handling
# If you find colors look "washed out" or incorrect, you can tweak these experimental settings.
debug {
    disable_scale_checks = true
	full_cm_proto = true
}

render {
   direct_scanout = 1
   cm_auto_hdr = 1
}

misc {
    vrr = 1
}
