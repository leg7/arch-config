#!/usr/bin/nft -f
# ipv4/ipv6 firewall, block everything coming in by default
# Open necessary ports only

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname lo accept
        ct state established,related accept

        iifname "virbr0" udp dport { 53, 67 } accept
        iifname "virbr0" tcp dport { 53, 67 } accept
        tcp dport 5555 accept comment "Qemu VNC/Spice"

        tcp dport { 80, 443 } accept
        tcp dport 9091 accept comment "Transmission"
        tcp dport 8384 accept comment "Syncthing"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept

        iifname "virbr0" accept
        iifname "virbr0" oifname "virbr0" accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
