#!/usr/bin/nft -f
# ipv4/ipv6 firewall, block everything coming in by default

# 1. Define the NAT table (REQUIRED for VM internet access)
table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # Masquerade traffic from the VM subnet leaving via wlan0
        # Replace 192.168.122.0/24 with your specific VM subnet if different
        ip saddr 192.168.122.0/24 oifname "wlan0" masquerade
    }
}

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname lo accept
        ct state established,related accept

        # Allow VM to talk to the host's DNS/DHCP (dnsmasq)
        iifname "virbr0" udp dport { 53, 67 } accept
        iifname "virbr0" tcp dport { 53, 67 } accept

        tcp dport 5555 accept comment "Qemu VNC/Spice"
        tcp dport { 80, 443 } accept
        tcp dport 9091 accept comment "Transmission"
        tcp dport 8384 accept comment "Syncthing"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept

        # Allow VM to access the internet
        iifname virbr0 accept
        oifname virbr0 accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
